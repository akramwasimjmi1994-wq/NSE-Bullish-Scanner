name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Bullish-Scanner-Android-build-log
          path: android/build.log
      - name: Prepare APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NSE-Bullish-Scanner-Android.apk
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Bullish-Scanner-Android
          path: android/app/build/outputs/apk/debug/NSE-Bullish-Scanner-Android.apk
      - name: Publish Android release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.0.1 --yes || true
          gh release create android-v1.0.1 app/build/outputs/apk/debug/NSE-Bullish-Scanner-Android.apk --title "NSE Bullish Scanner Android v1.0.1" --notes "Android scanner with Market Scanner, Stock Check, and in-app update check."
